name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Nightly runs at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        rust: [ stable, beta, nightly ]
        include:
          # Only run nightly on Ubuntu to save resources
          - os: ubuntu-latest
            rust: nightly
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run cargo check
        run: cargo check
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
      
      - name: Run security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true
      
      - name: Run cargo deny (license and dependency checks)
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses
          cargo deny check advisories
        continue-on-error: true

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Install cargo-deb
        run: cargo install cargo-deb
      
      - name: Build .deb package
        run: cargo deb --output target/opencrust_${{ github.ref_name }}_amd64.deb
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_crust-linux-x86_64
          path: target/release/open_crust
      
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencrust_${{ github.ref_name }}_amd64.deb
          path: target/opencrust_${{ github.ref_name }}_amd64.deb

  docs:
    name: Build Documentation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Zola
        uses: taiki-e/install-action@zola
      
      - name: Build documentation site
        run: |
          cd site
          zola build
      
      - name: Generate search index
        run: |
          ./scripts/generate_search_index.sh
      
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencrust-docs-${{ matrix.os }}
          path: site/public
          retention-days: 7

  # Integration-only tests (run on schedule and manual dispatch)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run integration tests
        run: cargo test --tests --verbose
        continue-on-error: true

  # Benchmark tests (run on schedule)
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run benchmarks
        run: cargo bench --bench benchmark -- --save-baseline main
        continue-on-error: true

  # PR size check
  check-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check PR diff size
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          TOTAL_LINES=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | awk '{print $NF}')
          echo "Changed files: $CHANGED_FILES"
          echo "Total lines changed: $TOTAL_LINES"
          
          if [ "$CHANGED_FILES" -gt 30 ]; then
            echo "::warning title=Large PR::This PR changes $CHANGED_FILES files (limit: 30)"
          fi
          if [ "$TOTAL_LINES" -gt 1000 ]; then
            echo "::warning title=Large PR::This PR changes $TOTAL_LINES lines (limit: 1000)"
          fi

  # Coverage reporting
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # Release automation
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/open_crust
          generate_release_notes: true