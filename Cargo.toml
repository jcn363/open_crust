[workspace]
resolver = "2"
members = [
    "opencrust",
    "opencrust-codegen",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcn363/open_crust"
homepage = "https://github.com/jcn363/open_crust"
documentation = "https://github.com/jcn363/open_crust/tree/main/docs"
readme = "README.md"
keywords = ["ai", "tui", "mcp", "llm", "agent"]
categories = ["command-line-utilities", "development-tools", "ai"]

[workspace.dependencies]
ratatui = "0.30.0"
crossterm = "0.29.0"
tokio = { version = "1.52.1", features = ["full"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
glob = "0.3.3"
dirs = "6.0.0"
serde_yaml = "0.9.34"
chrono = { version = "0.4.44", features = ["serde"] }
shell-words = "1.1.0"
async-recursion = "1.1.1"
regex = "1.12.3"
url = "2.5.8"
async-trait = "0.1.83"
once_cell = "1.21.0"
walkdir = "2.5.0"
arboard = "3.5.0"
html2md = "0.2.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
similar = "2.6"
lru = "0.18"
nucleo = "0.5"
rayon = "1.10"
hostname = "0.3"
ssh2 = "0.9"
nix = "0.28"
libc = "0.2"

# Codegen dependencies
tera = "1.20"
handlebars = "5.0.0-beta.5"
csv = "1.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "json", "chrono", "uuid"] }
anyhow = "1.0"
thiserror = "2.0"

[workspace.dev-dependencies]
tempfile = "3.20.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6.0"
insta = { version = "1.42.0", features = ["json"] }
wiremock = "0.5"

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
