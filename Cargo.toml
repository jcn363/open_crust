[package]
name = "open_crust"
version = "0.1.0"
edition = "2024"
description = "Production TUI platform for AI-powered coding with MCP/LSP integration, multi-agent orchestration, and semantic code search"
license = "MIT OR Apache-2.0"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29.0"
tokio = { version = "1.52.1", features = ["full"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
glob = "0.3.3"
dirs = "6.0.0"
serde_yaml = "0.9.34"
chrono = { version = "0.4.44", features = ["serde"] }
async-recursion = "1.1.1"
regex = "1.12.3"
url = "2.5.8"
walkdir = "2.5.0"
arboard = "3.5.0"
html2md = "0.2.15"
uuid = { version = "1.8", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "opencrust"
path = "src/main.rs"

[package.metadata.deb]
name = "opencrust"
maintainer = "OpenCrust Team <dev@opencrust.ai>"
copyright = "2026 OpenCrust Contributors"
depends = "$auto"
extended-description = """\
OpenCrust is a production TUI platform for AI-powered coding tasks. \
It provides terminal-native AI assistance with MCP/LSP integration, \
multi-agent orchestration, semantic code search, and desktop notifications."""

[dev-dependencies]
tempfile = "3.20.0"
